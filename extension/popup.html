<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1a1a1a;
      color: #e5e5e5;
      margin: 0;
      padding: 16px;
    }
    h2 { margin-top: 0; color: #a78bfa; font-size: 1.2rem; }
    .page-info {
      background: #2d2d2d;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .page-title {
      font-weight: bold;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .page-url {
      color: #888;
      font-size: 0.8rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .user-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 0.8rem;
      color: #888;
    }
    #logoutBtn {
      width: auto;
      padding: 4px 10px;
      font-size: 0.75rem;
      background: #444;
      border-radius: 4px;
    }
    #logoutBtn:hover { background: #555; }
    button {
      width: 100%;
      padding: 10px;
      background: #8b5cf6;
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
      font-size: 0.9rem;
    }
    button:hover { background: #7c3aed; }
    button:disabled { background: #555; cursor: not-allowed; }
    .google-btn {
      background: #fff;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 500;
      border: 1px solid #ddd;
    }
    .google-btn:hover { background: #f5f5f5; }
    .google-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
    #status, #loginStatus {
      margin-top: 10px;
      font-size: 0.85rem;
      text-align: center;
      min-height: 20px;
    }
    .success { color: #34d399; }
    .error { color: #f87171; }
    .login-info {
      text-align: center;
      color: #666;
      font-size: 0.8rem;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <h2>Memoir Scout</h2>

  <div id="loginSection" style="display:none;">
    <p class="login-info">Memoir AI 계정으로 로그인하세요</p>
    <button id="googleLoginBtn" class="google-btn">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Google로 로그인
    </button>
    <div id="loginStatus"></div>
  </div>

  <div id="mainSection" style="display:none;">
    <div class="user-bar">
      <span id="userEmail"></span>
      <button id="logoutBtn">로그아웃</button>
    </div>
    <div class="page-info">
      <div class="page-title" id="title">Loading...</div>
      <div class="page-url" id="url">...</div>
    </div>
    <button id="saveBtn">메모리에 저장</button>
    <div id="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
