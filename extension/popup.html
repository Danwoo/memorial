<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #1a1a1a;
      --bg-secondary: #2d2d2d;
      --text: #e5e5e5;
      --text-dim: #888;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --success: #34d399;
      --error: #f87171;
      --border: #444;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f9fafb;
        --bg-secondary: #ffffff;
        --text: #1f2937;
        --text-dim: #6b7280;
        --border: #d1d5db;
      }
    }
    * { box-sizing: border-box; }
    body {
      width: 340px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
    }
    h2 { margin-top: 0; color: var(--accent); font-size: 1.2rem; }
    .page-info {
      background: var(--bg-secondary);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    .page-title {
      font-weight: bold;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .page-url {
      color: var(--text-dim);
      font-size: 0.78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .user-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 0.8rem;
      color: var(--text-dim);
    }
    #logoutBtn {
      width: auto;
      padding: 4px 10px;
      font-size: 0.75rem;
      background: var(--border);
      border-radius: 4px;
      color: var(--text);
    }
    #logoutBtn:hover { opacity: 0.8; }

    /* 메모/태그 입력 */
    .input-group { margin-bottom: 10px; }
    .input-group label {
      display: block;
      font-size: 0.78rem;
      color: var(--text-dim);
      margin-bottom: 4px;
    }
    textarea, input[type="text"] {
      width: 100%;
      padding: 8px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.85rem;
      resize: vertical;
    }
    textarea:focus, input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
    }
    textarea { min-height: 56px; max-height: 120px; }

    /* 토글 */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 0.82rem;
    }
    .toggle-row label { color: var(--text-dim); cursor: pointer; }
    .toggle-switch {
      position: relative;
      width: 36px; height: 20px;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; inset: 0;
      background: var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }
    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 16px; height: 16px;
      left: 2px; bottom: 2px;
      background: white;
      border-radius: 50%;
      transition: 0.2s;
    }
    .toggle-switch input:checked + .toggle-slider { background: var(--accent); }
    .toggle-switch input:checked + .toggle-slider::before { transform: translateX(16px); }

    /* 버튼 */
    button {
      width: 100%;
      padding: 10px;
      background: var(--accent);
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
      font-size: 0.9rem;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { background: var(--border); cursor: not-allowed; color: var(--text-dim); }
    .google-btn {
      background: #fff;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 500;
      border: 1px solid #ddd;
    }
    .google-btn:hover { background: #f5f5f5; }
    .google-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
    #status, #loginStatus {
      margin-top: 10px;
      font-size: 0.85rem;
      text-align: center;
      min-height: 20px;
    }
    .success { color: var(--success); }
    .error { color: var(--error); }
    .login-info {
      text-align: center;
      color: var(--text-dim);
      font-size: 0.8rem;
      margin-bottom: 16px;
    }

    /* 성공 애니메이션 */
    @keyframes checkmark {
      0% { transform: scale(0); opacity: 0; }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); opacity: 1; }
    }
    .save-success {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 16px 0;
    }
    .save-success .check-icon {
      width: 48px; height: 48px;
      background: var(--success);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: checkmark 0.4s ease-out;
    }
    .save-success .check-icon svg { width: 28px; height: 28px; }
    .save-success p { color: var(--success); font-weight: 600; margin: 0; }
    .today-count {
      font-size: 0.78rem;
      color: var(--text-dim);
      text-align: center;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h2>Memoir Scout</h2>

  <div id="loginSection" style="display:none;">
    <p class="login-info">Memoir AI 계정으로 로그인하세요</p>
    <button id="googleLoginBtn" class="google-btn">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Google로 로그인
    </button>
    <div id="loginStatus"></div>
  </div>

  <div id="mainSection" style="display:none;">
    <div class="user-bar">
      <span id="userEmail"></span>
      <button id="logoutBtn">로그아웃</button>
    </div>
    <div class="page-info">
      <div class="page-title" id="title">Loading...</div>
      <div class="page-url" id="url">...</div>
    </div>

    <div class="input-group">
      <label for="memoInput">메모 (선택)</label>
      <textarea id="memoInput" placeholder="이 페이지에 대한 메모를 남겨보세요..."></textarea>
    </div>
    <div class="input-group">
      <label for="tagsInput">태그 (쉼표로 구분)</label>
      <input type="text" id="tagsInput" placeholder="예: 기술, AI, 참고자료">
    </div>
    <div class="toggle-row">
      <label for="includeBody">페이지 본문 포함</label>
      <div class="toggle-switch">
        <input type="checkbox" id="includeBody" checked>
        <span class="toggle-slider"></span>
      </div>
    </div>

    <div id="saveArea">
      <button id="saveBtn">메모리에 저장</button>
    </div>
    <div id="successArea" style="display:none;">
      <div class="save-success">
        <div class="check-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <p>저장 완료!</p>
      </div>
      <div class="today-count" id="todayCount"></div>
    </div>
    <div id="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
