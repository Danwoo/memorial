repos:
  # Backend: ruff lint + format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # Frontend: eslint (runs from frontend/ directory where .eslintrc.cjs lives)
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: bash -c 'cd frontend && npx eslint --max-warnings=0 "${@#frontend/}"' --
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: true
