name: Keep Alive

on:
  schedule:
    # 매주 화/금 09:00 UTC — Supabase 무료 티어 7일 자동 일시정지 방지
    - cron: '0 9 * * 2,5'
  workflow_dispatch:

jobs:
  ping-supabase:
    name: Supabase Keep-Alive Ping
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o /dev/null -w "HTTP %{http_code}\n"
          echo "Supabase ping complete"

  ping-render:
    name: Render Keep-Alive Ping
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Endpoint
        run: |
          curl -sf "${{ secrets.RENDER_URL }}/health" \
            -o /dev/null -w "HTTP %{http_code}\n" || echo "Render may be sleeping"
          echo "Render ping complete"
