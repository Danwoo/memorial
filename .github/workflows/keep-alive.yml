name: Keep Alive

on:
  schedule:
    # 10분 간격 — Render 무료 티어 슬립 방지 (15분 비활성 시 슬립)
    # 카카오 봇 webhook 5초 타임아웃 대응: 콜드 스타트 ~30초 방지
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Keep-Alive Ping
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Endpoint
        run: |
          curl -sf "${{ secrets.RENDER_URL }}/health" \
            -o /dev/null -w "Render: HTTP %{http_code}\n" \
            --max-time 60 || echo "Render waking up..."
          echo "Render ping complete"

      - name: Ping Supabase REST API
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o /dev/null -w "Supabase: HTTP %{http_code}\n"
          echo "Supabase ping complete"
