name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    name: Frontend (TypeScript + ESLint + Test + Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: TypeScript 타입 체크
        run: npx tsc --noEmit

      - name: ESLint 검증
        run: npx eslint . --ext ts,tsx --max-warnings 0

      - name: 유닛 테스트
        run: npx vitest run

      - name: Vite 빌드
        run: npx vite build

  backend:
    name: Backend (Ruff + Test + 구문 검증)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt pytest pytest-asyncio ruff

      - name: Ruff lint 검증
        run: ruff check app/

      - name: 단위 테스트
        run: python -m pytest tests/ -v

      - name: Python 구문 검증
        run: |
          find app -name "*.py" -exec python -c "
          import ast, sys
          try:
              ast.parse(open(sys.argv[1], encoding='utf-8').read())
          except SyntaxError as e:
              print(f'FAIL: {sys.argv[1]}: {e}')
              sys.exit(1)
          " {} \;
