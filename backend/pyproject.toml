[project]
name = "memoir-ai-backend"
version = "0.1.0"
description = "Memoir AI - Intelligent Knowledge Ledger Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "supabase>=2.3.0",
    "httpx>=0.26.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "python-multipart>=0.0.12",
    "langchain>=0.1.0",
    "langchain-openai>=0.1.20",
    "langchain-google-genai>=2.1.0",
    "langchain-community>=0.0.20",
    "langgraph>=0.0.20",
    "tiktoken>=0.7.0", # For token counting & embeddings
    "jsonpointer>=2.0",
    "kuzu>=0.8.0",
    "python-dotenv>=1.0.0",
    "sniffio>=1.3.0",
    "apscheduler>=3.10.0",
    "pywebpush>=2.0.0",
    "upstash-redis>=1.0.0",
    "networkx>=3.0",
    "python-louvain>=0.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".venv", "__pycache__", ".git"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

