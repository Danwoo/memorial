app = 'memoir-ai-backend'
primary_region = 'nrt'

[env]
  KUZU_DB_PATH = "/data/kuzu"
  ALLOWED_ORIGINS = "https://memoir-ai.vercel.app,https://memoir-ai-frontend.vercel.app"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "kuzu_data"
  destination = "/data/kuzu"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
